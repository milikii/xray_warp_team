name: VLessInboundConfig
component: proxy/vless/inbound
version_introduced: v1.0.0
version_deprecated: ""
version_removed: ""
status: stable
server_client: server-only
source:
  docs: https://xtls.github.io/config/inbounds/vless.html
  code: infra/conf/vless.go
  commit: current
fields:
  - name: clients
    type: []json.RawMessage (users)
    required: true
    server_client: server-only
    notes: 服务端用户列表，每个用户需包含 id(UUID) 和 flow。

  - name: decryption
    type: string
    required: true
    default: none
    server_client: server-only
    notes: >
      必须设置为 "none"。若使用 mlkem768x25519plus 加密前缀（实验性），
      则按特定格式填写，不能与 fallbacks 同时使用。

  - name: fallbacks
    type: []*VLessInboundFallback
    required: false
    server_client: server-only
    notes: >
      回落配置。与 decryption != "none" 不能同时存在。
      每个 fallback 包含 name, alpn, path, type, dest, xver。

  - name: flow
    type: string
    required: false
    default: ""
    server_client: server-only
    notes: >
      当前仅支持空字符串或 "xtls-rprx-vision"（源码中常量 vless.XRV）。
      若为空，则继承到每个用户的 account.Flow。

  - name: testseed
    type: []uint32
    required: false
    server_client: server-only
    notes: 实验性字段，内部测试用途。

confidence: source-confirmed
