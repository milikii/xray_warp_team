name: REALITYConfig
component: transport/internet/reality
version_introduced: v1.8.0
version_deprecated: ""
version_removed: ""
status: stable
server_client: depends
source:
  docs: https://xtls.github.io/config/transport.html#realitysettings
  code: infra/conf/transport_security.go
  commit: current
notes: >
  REALITY 配置在服务端和客户端共用同一结构，但字段要求截然不同。
  源码通过 dest 是否存在来区分服务端/客户端模式。

fields:
  # === 服务端独有字段 (dest != nil) ===
  - name: dest / target
    type: json.RawMessage (uint16 or string)
    required: true (server)
    server_client: server-only
    notes: >
      服务端目标地址。可以是端口号或地址字符串。
      旧字段名为 target，现已由 dest 统一替代。

  - name: type
    type: string
    required: false (auto-detected)
    server_client: server-only
    notes: >
      目标类型。若 dest 以 @ 或 / 开头自动识别为 unix；
      纯数字识别为 tcp（会自动补 localhost:port）；
      含冒号识别为 tcp。

  - name: xver
    type: uint64
    required: false
    default: 0
    server_client: server-only
    notes: >
      PROXY protocol 版本。仅接受 0, 1, 2。

  - name: serverNames
    type: []string
    required: true (server)
    server_client: server-only
    notes: 服务端允许的真实 ServerName 列表。不能为空。

  - name: privateKey
    type: string (base64.RawURLEncoding, 32 bytes)
    required: true (server)
    server_client: server-only
    notes: 服务端私钥。

  - name: minClientVer / maxClientVer
    type: string (x.y.z)
    required: false
    server_client: server-only
    notes: >
      限制客户端最低/最高版本。每个部分需小于 256。
      默认无限制，但维护者建议设置 minClientVer。

  - name: maxTimeDiff
    type: uint64
    required: false
    server_client: server-only
    notes: 允许的最大客户端时间差（毫秒）。

  - name: shortIds
    type: []string (hex, max 16 chars each)
    required: true (server)
    server_client: server-only
    notes: 服务端允许的 ShortId 列表。不能为空，每项最多 16 字符十六进制。

  - name: mldsa65Seed
    type: string (base64.RawURLEncoding, 32 bytes)
    required: false
    server_client: server-only
    notes: ML-DSA-65 种子，不能与 privateKey 相同。

  - name: limitFallbackUpload / limitFallbackDownload
    type: LimitFallback
    required: false
    server_client: server-only
    notes: 实验性限速回落配置。

  # === 客户端独有字段 (dest == nil) ===
  - name: fingerprint
    type: string
    required: true (client)
    server_client: client-only
    notes: >
      TLS 指纹。不能为 "unsafe" 或 "hellogolang"。
      必须通过 tls.GetFingerprint() 校验存在。

  - name: serverName
    type: string
    required: false
    server_client: client-only
    notes: 客户端请求的实际 SNI。

  - name: publicKey / password
    type: string (base64.RawURLEncoding, 32 bytes)
    required: true (client)
    server_client: client-only
    notes: >
      服务端公钥。旧字段名为 password，现已由 publicKey 替代。

  - name: shortId
    type: string (hex, max 16 chars)
    required: false
    server_client: client-only
    notes: 客户端使用的 ShortId。与服务端 shortIds 列表中的某一项匹配。

  - name: mldsa65Verify
    type: string (base64.RawURLEncoding, 1952 bytes)
    required: false
    server_client: client-only
    notes: ML-DSA-65 验证公钥。

  - name: spiderX
    type: string
    required: false
    default: "/"
    server_client: client-only
    notes: >
      爬虫路径。必须以 "/" 开头。支持查询参数：
      p=padding, c=concurrency, t=times, i=interval, r=return。

  # === 共用字段 ===
  - name: show
    type: bool
    required: false
    default: false
    server_client: server-and-client
    notes: 是否显示调试信息。

  - name: masterKeyLog
    type: string
    required: false
    server_client: server-and-client
    notes: TLS 密钥日志文件路径（调试用）。

confidence: source-confirmed
