name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shellcheck-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq openssl unzip

      # smoke 会把宿主机的 xray 软链进沙箱，然后真的去跑 xray vlessenc / x25519 /
      # run -test。runner 上没有 xray，所以第 4 条用例就 die 了——CI 从 3b167b7
      # 起一直红在这儿，而本机是装着 xray 的生产节点，85 条全绿，谁都没看出来。
      # 版本钉死并校验 sha256：CI 红了应该是这个仓库的问题，
      # 不该是上游哪天发了个新版本。要升级就一起改这两行。
      - name: Install Xray-core
        env:
          XRAY_VERSION: v26.3.27
          XRAY_SHA256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          printf '%s  %s\n' "${XRAY_SHA256}" "${tmp}/xray.zip" | sha256sum -c -
          unzip -qo "${tmp}/xray.zip" -d "${tmp}/xray"
          sudo install -m 0755 "${tmp}/xray/xray" /usr/local/bin/xray
          /usr/local/bin/xray version | head -n 1

      - name: Run Shellcheck
        run: shellcheck xtun.sh $(find lib tests -type f -name '*.sh' | sort)

      # 一定要跑：这个 job 原来是 shellcheck 先红，Actions 直接跳过后面的步骤，
      # 于是 smoke 从来没在 CI 里执行过——所有 lint 都只在本地手工跑时才有效。
      # 一个 shellcheck 的 note 不该再有能力把整套用例的结果藏起来。
      - name: Run Smoke Tests
        if: ${{ !cancelled() }}
        run: bash tests/smoke.sh

  # 真机冒烟：debian:13 systemd 容器里完整跑一遍 install + diagnose。
  # 沙箱用例永远碰不到 systemd / apt / 真实 haproxy / nginx，这一层只有真机跑得出来。
  # 容器必须以 /sbin/init 起（systemd 才是 PID 1），install 再通过 docker exec 进去跑；
  # 网络不可达导致 check-sni 失败时走 --skip-sni-check。
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start debian:13 systemd container
        run: |
          # 基础镜像里没有 /sbin/init：先装 systemd + systemd-sysv，再 exec 成 PID 1。
          docker run -d --name smoke --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${PWD}:/src:ro" \
            debian:13 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq systemd systemd-sysv >/dev/null
              exec /sbin/init
            '

      - name: Wait for systemd
        run: |
          for i in $(seq 1 30); do
            if docker exec smoke systemctl list-units >/dev/null 2>&1; then
              echo "systemd ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs smoke || true
          exit 1

      - name: Run install smoke
        run: |
          docker exec smoke bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl openssl jq ca-certificates procps >/dev/null
            cp -a /src /root/xtun
            cd /root/xtun
            bash xtun.sh install --non-interactive \
              --server-ip 127.0.0.1 \
              --reality-sni www.stanford.edu \
              --xhttp-domain cdn.example.test \
              --cert-mode self-signed \
              --disable-warp \
              --disable-net-opt \
              --no-manage-nginx-main \
              --skip-sni-check
            bash xtun.sh diagnose
            test -d /root/xtun-qr
            test "$(ls /root/xtun-qr/*.png | wc -l)" -ge 5
            test ! -e /var/www/xtun-sub
            ! grep -q '/sub/' /etc/nginx/conf.d/xtun.conf
            xtun show-links --qr | grep -q '二维码 ('
            grep -q '^## 二维码' /root/xtun-output.md
          '

      - name: TLS debug（diagnose 失败时留现场）
        if: ${{ always() }}
        run: |
          docker exec smoke bash -c '
            echo "===== s_client ====="
            echo | timeout 8 openssl s_client -connect 127.0.0.1:443 -servername cdn.example.test 2>&1 | tail -25 || true
            echo "===== curl ====="
            curl -kv --max-time 8 --resolve cdn.example.test:443:127.0.0.1 https://cdn.example.test/ 2>&1 | tail -25 || true
            echo "===== listeners ====="
            ss -ltnp 2>/dev/null || ss -ltn || true
            echo "===== haproxy log ====="
            tail -20 /var/log/haproxy.log 2>/dev/null || journalctl -u haproxy --no-pager -n 20 2>/dev/null || true
            echo "===== nginx error log ====="
            tail -20 /var/log/nginx/error.log 2>/dev/null || journalctl -u nginx --no-pager -n 20 2>/dev/null || true
          '

      - name: Stop container
        if: ${{ always() }}
        run: docker rm -f smoke
